<main class="page-content" *ngIf="blog.status!='InActive' && blog.trash!=1">
    <div class="dn-breadcaump-area breadcrumb-default bg_image about-us pt--250  pb--130 pt_md--150  pb_md--100 pt_lg--150  pb_lg--100 pt_sm--150  pb_sm--100">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="breadcrumb-content text-center">
            <h1 class="breadcrumb-content__title text-white fontWeight400">{{blog.title}}</h1>
            <ul class="breadcrumb-content__nav text-white">
              <li><a routerLink="/home">Home</a></li>
              <li class="separator">/</li>
              <li><a routerLink="/media">Media</a></li>
              <li class="separator">/</li>
              <li class="active"><a routerLink="/blog">Blog</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    </div>
    <div class="container">
        <div class="row mt--50">
            <div class="col-xl-12 col-lg-12 col-md-12" > 
                 <div class="site-content-inner">
                    <div class="page-content">
                      <div class="single-post-detail clearfix">
                        <article id="post-1" class="single-post-content article-post-no-builder post-1 post type-post status-publish format-standard has-post-thumbnail hentry category-technology">
                          <div class="row">
                          <div class="col-xl-10 col-lg-10">
                            <div class="post-meta post-meta-top">
                              <div class="entry-header entry-header-above single_post_item--title">
                                <h1 class="entry-title font--32 mb-0">
                                {{blog.title}}
                                </h1>
                              </div>
                            </div>
                          </div>
                          </div>
                            <div class="row align-items-center">
                              <div class="col-8">
                               
                                <span class="post__date post-meta__item">
                                  <a class="text-muted">
                                    <span>Posted on: </span> 
                                    <time class="entry-date published">{{blog.pdate | date:'dd MMM yyyy'}}</time>
                                    <p><small><b> By {{blog.author}}</b></small></p>
                                   </a>
                                </span>
                              </div>
                              <div class="col-4 text-right">
                                 <button   (click)="like()" class="btn btn-default" [ngClass]="statusClass"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M6.633 10.5c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 012.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 00.322-1.672V3a.75.75 0 01.75-.75A2.25 2.25 0 0116.5 4.5c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 01-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 00-1.423-.23H5.904M14.25 9h2.25M5.904 18.75c.083.205.173.405.27.602.197.4-.078.898-.523.898h-.908c-.889 0-1.713-.518-1.972-1.368a12 12 0 01-.521-3.507c0-1.553.295-3.036.831-4.398C3.387 10.203 4.167 9.75 5 9.75h1.053c.472 0 .745.556.5.96a8.958 8.958 0 00-1.302 4.665c0 1.194.232 2.333.654 3.375z" />
                                </svg> | <span class ="likes-counter">{{likeCount}}</span>
                                </button>
                                <button class="btn" (click)="shareUrl()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" />
                                </svg>
                                </button>

                                
                              </div>  
                            </div> 
                         
                          <div class="entry-thumbnail pt-2"> 
                                  <img class="w-100" src="{{(blog.image=='' || blog.image==null) ? 'assets/img/banner_dummy.jpg' :  mediaUrl+blog.image}}" > 

                          </div>
                          <div class="entry-content entry-content-no-builder pt-5 pb-5">
                            <div [innerHTML]="blog.content">  </div>
                          </div>
                        </article>

                      </div>
                    </div>
                  </div>
    
            </div>
        </div>
    </div>
    
    </main>
